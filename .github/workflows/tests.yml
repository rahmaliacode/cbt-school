name: CBT tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: cbt_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, zip, gd, pdo_mysql, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: cbt_test
          DB_USERNAME: root
          DB_PASSWORD: test_password
      - run: php artisan view:cache
      - run: node --check public/assets/exam.js && node --check public/assets/monitor.js && node --check public/assets/experience.js && node --check public/assets/media.js && node --check public/assets/exam-guard.js && node tests/exam-guard.cjs
